# =============================================================
# AI Financial Agent - Nginx 配置
# 前端静态资源托管 + /api、/chat/stream 反向代理到 backend:8000
#
# 路径约定（与 vite 开发代理行为一致）：
#   /api/sessions     -> 去掉 /api 前缀转发 -> backend /sessions
#   /chat/stream      -> 原样转发（SSE 长连接）
# SSE 关键配置：proxy_buffering off + proxy_cache off + Connection ""
#   + 长超时，保证流式增量逐块即时下发、不缓冲不截断。
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 静态资源：Vite 产物文件名带内容哈希，可长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 常规 API：去 /api 前缀转发到后端 ----
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- SSE 流式聊天：禁止缓冲与缓存，保持长连接 ----
    location /chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
