# =============================================================
# AI Financial Agent - Nginx 配置
# 前端静态资源托管 + /api、/chat/stream 反向代理到 backend:8000
#
# 路径约定（与 vite 开发代理行为一致）：
#   /api/sessions     -> 去掉 /api 前缀转发 -> backend /sessions
#   /chat/stream      -> 原样转发（SSE 长连接）
# SSE 关键配置：proxy_buffering off + proxy_cache off + Connection ""
#   + 长超时，保证流式增量逐块即时下发、不缓冲不截断。
#
# Phase 24 公网 Demo 加固：
#   - 普通 API 限流（10 r/s，burst 20）+ 单 IP 并发 SSE 长连接上限 2
#   - 基础安全响应头（X-Content-Type-Options / X-Frame-Options / Referrer-Policy）
#   - /api/ 反代超时 >= 后端 Runtime 预算 120s（取 150s）
#   - HTTPS 就绪模板见文末（默认关闭，配合 Cloudflare 全接入时启用）
# =============================================================

# ---- 限流 / 并发区域（http 级，conf.d 文件顶层即 http 上下文）----
limit_req_zone  $binary_remote_addr zone=api_limit:10m        rate=10r/s;
limit_conn_zone $binary_remote_addr zone=chat_stream_limit:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限：聊天请求体仅含 message/session_id JSON，1m 足够；
    # 显式声明防止超大请求体占用后端资源（公网防滥用）
    client_max_body_size 1m;

    # ---- 基础安全响应头（always：4xx/5xx 与错误页同样携带）----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 静态资源：Vite 产物文件名带内容哈希，可长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # location 自带 add_header 会阻断 server 级继承，需在此补齐安全头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- 常规 API：去 /api 前缀转发到后端 + 基础限流 ----
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端 Agent Runtime 预算 120s；反代超时放宽到 150s 防截断
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
    }

    # ---- SSE 流式聊天：禁止缓冲与缓存，保持长连接 ----
    location /chat/stream {
        # 单 IP 同时最多 2 个 SSE 长连接，防止 DeepSeek 推理被无限并发消耗
        limit_conn chat_stream_limit 2;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================
# HTTPS 就绪模板（默认关闭，不生成假证书）
#
# 启用步骤（配合 Cloudflare 全接入，TLS 终止在 Cloudflare 或本机二选一）：
#   1. Cloudflare 控制台：DNS 记录开启 Proxy（橙色云朵），TLS/SSL 模式选
#      Flexible（Nginx 保持 80 即可）或 Full/Full(strict)（需本机证书）；
#   2. 若走 Full，把 Cloudflare Origin 证书（或自有证书）放到
#      /etc/nginx/certs/ 后取消下方 server 块注释；
#   3. 保留上方 80 块（可改为 301 跳转 https），或按需删除。
